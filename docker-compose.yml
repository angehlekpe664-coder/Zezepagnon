version: '3.8'

services:
  zezepagnon-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zezepagnon_app
    restart: always
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
